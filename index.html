const SUPABASE_URL = "https://egxythuuilullfoqzgqh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ANVaKAXrPUTOv7nyoRNbwg_-D16FFzN";

const EDGE_FUNCTIONS_URL = SUPABASE_URL ? `${SUPABASE_URL}/functions/v1` : "";
const supabaseClient = (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
const backendReady = !!supabaseClient;

async function getOrCreateAthlete(email) {
  if (!supabaseClient || !email) return null;
  try {
    let { data: athlete } = await supabaseClient.from("athletes").select("id").eq("email", email).maybeSingle();
    if (!athlete) {
      const { data: created, error } = await supabaseClient.from("athletes").insert({ email }).select("id").single();
      if (error) { console.error(error); return null; }
      athlete = created;
    }
    return athlete.id;
  } catch (err) {
    console.error("getOrCreateAthlete failed:", err);
    return null;
  }
}

async function saveIntakeResponses(athleteId, answers) {
  if (!supabaseClient || !athleteId) return;
  try { await supabaseClient.from("intake_responses").insert({ athlete_id: athleteId, answers }); }
  catch (err) { console.error("saveIntakeResponses failed:", err); }
}

async function saveTestResultsToDb(athleteId, results) {
  if (!supabaseClient || !athleteId) return;
  try { await supabaseClient.from("test_results").insert({ athlete_id: athleteId, results }); }
  catch (err) { console.error("saveTestResultsToDb failed:", err); }
}

async function uploadMovementVideo(athleteId, movementId, file) {
  if (!supabaseClient || !athleteId) return null;
  try {
    const path = `${athleteId}/${movementId}-${Date.now()}-${file.name}`;
    const { error: uploadError } = await supabaseClient.storage.from("movement-videos").upload(path, file);
    if (uploadError) { console.error(uploadError); return null; }
    await supabaseClient.from("movement_videos").insert({ athlete_id: athleteId, movement_id: movementId, storage_path: path });
    return path;
  } catch (err) {
    console.error("uploadMovementVideo failed:", err);
    return null;
  }
}

async function startCheckout(plan, email) {
  if (!EDGE_FUNCTIONS_URL) return null;
  try {
    const res = await fetch(`${EDGE_FUNCTIONS_URL}/create-checkout-session`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ plan, email }),
    });
    const data = await res.json();
    return data.url || null;
  } catch (err) {
    console.error("startCheckout failed:", err);
    return null;
  }
}

async function checkSubscriptionStatus(email) {
  if (!EDGE_FUNCTIONS_URL || !email) return null;
  try {
    const res = await fetch(`${EDGE_FUNCTIONS_URL}/check-subscription?email=${encodeURIComponent(email)}`, {
      headers: { Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    return await res.json();
  } catch (err) {
    console.error("checkSubscriptionStatus failed:", err);
    return null;
  }
}

async function fetchResources() {
  if (!supabaseClient) return null;
  try {
    const { data, error } = await supabaseClient.from("resources").select("*").order("sort_order", { ascending: true });
    if (error) { console.error(error); return null; }
    return data;
  } catch (err) {
    console.error("fetchResources failed:", err);
    return null;
  }
}

async function getResourceUrl(resourceId, email) {
  if (!EDGE_FUNCTIONS_URL) return { error: "Backend not configured" };
  try {
    const res = await fetch(`${EDGE_FUNCTIONS_URL}/get-resource-url`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ resourceId, email }),
    });
    const data = await res.json();
    return data;
  } catch (err) {
    console.error("getResourceUrl failed:", err);
    return { error: String(err) };
  }
}

// Pulls everything needed to build a Coach Tools assessment report for one
// athlete: their most recent Phase 1 intake answers, most recent Phase 3
// test results, and which Phase 2 movements they've uploaded video for.
async function fetchAthleteForReport(email) {
  if (!supabaseClient || !email) return { error: "Backend not configured." };
  try {
    const { data: athlete } = await supabaseClient.from("athletes").select("id").eq("email", email).maybeSingle();
    if (!athlete) return { error: "No athlete found with that email." };

    const [{ data: intakeRows }, { data: testRows }, { data: videoRows }] = await Promise.all([
      supabaseClient.from("intake_responses").select("answers, submitted_at").eq("athlete_id", athlete.id).order("submitted_at", { ascending: false }).limit(1),
      supabaseClient.from("test_results").select("results, submitted_at").eq("athlete_id", athlete.id).order("submitted_at", { ascending: false }).limit(1),
      supabaseClient.from("movement_videos").select("movement_id").eq("athlete_id", athlete.id),
    ]);

    return {
      answers: intakeRows && intakeRows[0] ? intakeRows[0].answers : null,
      testResults: testRows && testRows[0] ? testRows[0].results : null,
      videoMovementIds: (videoRows || []).map((v) => v.movement_id),
    };
  } catch (err) {
    console.error("fetchAthleteForReport failed:", err);
    return { error: String(err) };
  }
}

async function verifyCoachPassword(password) {
  if (!EDGE_FUNCTIONS_URL) return { ok: false, error: "Backend not configured." };
  try {
    const res = await fetch(`${EDGE_FUNCTIONS_URL}/verify-coach-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ password }),
    });
    return await res.json();
  } catch (err) {
    console.error("verifyCoachPassword failed:", err);
    return { ok: false, error: String(err) };
  }
}

  <div style={{ display: "flex", height: 4, width: "100%", margin: "0" }}>
    <div style={{ flex: 1, background: "#2D6FE0" }} />
    <div style={{ flex: 1, background: "#D8342A" }} />
  </div>

const DASH_METRIC_TILE = ({ x, w, label, value, unit }) => (
  <g transform={`translate(${x}, 0)`}>
    <rect x="0" y="0" width={w} height="58" fill="#F4F5F6" stroke="#E2E5E7" />
    <text x="10" y="18" fill="#6B7278" fontSize="9" fontFamily="Arial, sans-serif" letterSpacing="0.5">{label}</text>
    <text x="10" y="42" fill="#14181B" fontSize="20" fontFamily="Arial, sans-serif" fontWeight="bold">{value}</text>
    {unit && <text x="10" y="53" fill="#6B7278" fontSize="8" fontFamily="Arial, sans-serif">{unit}</text>}
  </g>
);

const DASH_LINE_CHART = ({ w, h, color, points }) => {
  const max = Math.max(...points);
  const min = Math.min(...points);
  const range = max - min || 1;
  const stepX = w / (points.length - 1);
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"} ${i * stepX} ${h - ((p - min) / range) * h}`).join(" ");
  return (
    <g>
      {[0.25, 0.5, 0.75].map((f) => <line key={f} x1="0" y1={h * f} x2={w} y2={h * f} stroke="#E2E5E7" strokeWidth="1" />)}
      <path d={path} fill="none" stroke={color} strokeWidth="2" />
      {points.map((p, i) => <circle key={i} cx={i * stepX} cy={h - ((p - min) / range) * h} r="2.5" fill={color} />)}
    </g>
  );
};

function calcESD(sj, cmj) {
  const s = parseFloat(sj);
  const c = parseFloat(cmj);
  if (!s || !c || s <= 0) return null;
  return ((c - s) / s) * 100;
}

function interpretESD(esd) {
  if (esd === null) return null;
  if (esd < 10) return { label: "< 10% — Poor elastic utilization", detail: "May need plyometric/reactive emphasis if strength is adequate.", tier: "low" };
  if (esd <= 20) return { label: "10–20% — Balanced profile", detail: "No strong bias toward either force production or elastic utilization.", tier: "mid" };
  return { label: "> 20% — Strong use of the stretch-shortening cycle", detail: "Compare with sprint and strength data before deciding whether more maximal strength is needed.", tier: "high" };
}

// Simplified sprint acceleration / force-velocity profile from four splits
// (10/20/30/40yd). This is NOT a full Samozino-style F-V profile — a true
// F-V profile needs body mass and a continuous velocity-time curve (radar
// gun or similar) to solve for F0, V0, and Pmax. What this gives instead:
// segment (split-to-split) velocities and where the athlete is still
// gaining speed vs. plateauing within the tested distance, which is a
// reasonable practical proxy when only checkpoint splits are available.
const YARD_TO_M = 0.9144;
const LB_TO_KG = 0.453592;
function calcSprintFV(t10, t20, t30, t40, bodyweightLbs) {
  const a = parseFloat(t10), b = parseFloat(t20), c = parseFloat(t30), d = parseFloat(t40);
  if (!a || !b || !c || !d || b <= a || c <= b || d <= c) return null;
  const segM = 10 * YARD_TO_M;
  const v1 = segM / a;
  const v2 = segM / (b - a);
  const v3 = segM / (c - b);
  const v4 = segM / (d - c);
  const vEst = Math.max(v1, v2, v3, v4);
  const accelRatio = v1 / vEst;
  let tier, label, detail;
  if (accelRatio < 0.70) {
    tier = "velocity"; label = "Velocity-dominant";
    detail = "Still gaining significant speed through the later splits — meaningful speed reserve past the initial acceleration phase.";
  } else if (accelRatio <= 0.85) {
    tier = "balanced"; label = "Balanced";
    detail = "Reasonably even blend of early acceleration and continued speed gain across the splits.";
  } else {
    tier = "force"; label = "Force/Acceleration-dominant";
    detail = "Reaches most of its speed within the first 10yd and plateaus early — strong initial force application relative to continued acceleration.";
  }

  // Rough force/power estimate, only computed if bodyweight is available.
  // This treats each segment's velocity change over time as a net
  // horizontal acceleration and applies F = m·a, P = F·v — a simplified
  // kinematic estimate, NOT the full Samozino model (which also accounts
  // for air resistance and fits a continuous velocity curve rather than
  // four discrete segments). Useful as a rough, bodyweight-adjusted view,
  // not a lab-precision number.
  let force = null;
  const bw = parseFloat(bodyweightLbs);
  if (bw > 0) {
    const massKg = bw * LB_TO_KG;
    const a1 = v1 / a; // from rest
    const a2 = (v2 - v1) / (b - a);
    const a3 = (v3 - v2) / (c - b);
    const a4 = (v4 - v3) / (d - c);
    const F1 = massKg * a1, F2 = massKg * a2, F3 = massKg * a3, F4 = massKg * a4;
    const P1 = F1 * v1, P2 = F2 * v2, P3 = F3 * v3, P4 = F4 * v4;
    const forces = [F1, F2, F3, F4];
    const powers = [P1, P2, P3, P4];
    const Fmax = Math.max(...forces.map((f) => Math.abs(f)));
    const Pmax = Math.max(...powers.map((p) => Math.abs(p)));
    force = { massKg, forces, powers, Fmax, Pmax, FmaxPerKg: Fmax / massKg, PmaxPerKg: Pmax / massKg };
  }

  return { v1, v2, v3, v4, vEst, accelRatio, tier, label, detail, force };
}

// Converges the ESD tier (jump/elastic quality) with the sprint FV tier
// (acceleration/speed quality) into one action step. This is a rule-based
// synthesis, not a diagnostic algorithm — it's meant to give a starting
// point for the coach's own read of the full profile, not a final answer.
function convergeSummary(esdInterp, fv) {
  if (!esdInterp || !fv) return null;
  const key = `${esdInterp.tier}_${fv.tier}`;
  const table = {
    low_force: { priority: "Power Priority", text: "Limited elastic utilization paired with strong early force application that plateaus quickly — prioritize plyometric/reactive work to convert existing force capacity into elastic power." },
    low_balanced: { priority: "Power Priority", text: "Limited elastic utilization with a balanced sprint profile — prioritize plyometric and reactive strength work." },
    low_velocity: { priority: "Power Priority", text: "Limited elastic utilization but still gaining speed late in the sprint — prioritize reactive/plyometric work, with continued max-velocity exposure as a secondary focus." },
    mid_force: { priority: "Speed Priority", text: "Balanced elastic utilization with strong early acceleration that plateaus quickly — emphasize max-velocity mechanics and exposure to extend the speed curve." },
    mid_balanced: { priority: "Balanced", text: "Well-rounded profile across elastic utilization and sprint mechanics — continue balanced programming across strength, power, and speed." },
    mid_velocity: { priority: "Strength Priority", text: "Balanced elastic utilization but still building speed late, suggesting lighter early force application — prioritize acceleration mechanics and force production out of the start." },
    high_force: { priority: "Speed Priority", text: "Strong stretch-shortening cycle use with strong early acceleration that plateaus quickly — force and elastic qualities look solid; extend the speed curve with max-velocity work." },
    high_balanced: { priority: "Balanced", text: "Strong stretch-shortening cycle use with a balanced sprint profile — strong across the board; continue current programming and monitor." },
    high_velocity: { priority: "Balanced", text: "Strong stretch-shortening cycle use and still gaining speed late in the sprint — a strong power-and-speed profile; fine-tune early acceleration mechanics as a secondary focus." },
  };
  return table[key] || null;
}

// Builds the "Combined Athletic Profile" card (Sprint F-V + explosive
// strength) shown at the bottom of the printed report. Modeled on a
// Sprint F-V + DSI (Dynamic Strength Index) integrated profile — but this
// uses ESD (Explosive Strength Deficit, from SJ vs. CMJ) instead of true
// DSI, since DSI is normally derived from an isometric mid-thigh pull or
// similar force-plate test we don't collect here. Same spirit — converge
// two independent signals and flag where they agree or conflict — just
// built from the data this platform actually has.
function buildCombinedProfile(esdInterp, fv) {
  if (!esdInterp || !fv) return null;
  const sprintLabel = { velocity: "Force-Deficit", balanced: "Balanced", force: "Speed-Deficit" }[fv.tier];
  const esdLabel = { low: "Low (Poor Elastic Use)", mid: "Balanced", high: "High (Strong Elastic Use)" }[esdInterp.tier];
  const sprintPriorities = {
    velocity: ["Heavy sled pushing (>70% BW)", "Hip-dominant strength — trap bar deadlift, RDL", "Resisted sprints (10–20% BW)", "Nordic hamstring curls — eccentric emphasis"],
    balanced: ["Continue concurrent force and velocity development", "Maintain even acceleration and top-end speed exposure"],
    force: ["Max-velocity sprint exposure — flys, build-ups", "Sprint-float-sprint or wicket drills", "Contrast training — heavy sled push into max-effort sprint", "Maintain strength base — don't neglect force work"],
  }[fv.tier];
  const esdPriorities = {
    low: ["Plyometrics — depth drops, hurdle hops, bounding", "Jump training — maximal intent CMJ, SLJ, reactive jumps", "Short-duration explosive power (10–30s efforts)", "Sprint-contrast methods — heavy sled push into max-effort sprint", "Maintain strength base — don't neglect force work entirely"],
    mid: ["Continue balanced plyometric and strength work", "Monitor with periodic re-testing", "No single elastic-quality bias to correct"],
    high: ["Maintain current plyometric/elastic work", "Compare against absolute strength markers before adding max-strength emphasis", "Consider maximal strength work only if underlying force capacity is limited"],
  }[esdInterp.tier];
  const aligned =
    (esdInterp.tier === "low" && fv.tier === "velocity") ||
    (esdInterp.tier === "high" && fv.tier === "force") ||
    (esdInterp.tier === "mid" && fv.tier === "balanced");
  const summary = `Sprint F-V suggests ${sprintLabel.toLowerCase()} emphasis; ESD suggests a ${esdLabel.toLowerCase()} priority. ${
    aligned ? "Signals align — proceed with confidence on the shared emphasis." : "Signals diverge — run a concurrent block addressing both and re-test to determine the primary need."
  }`;
  return { sprintLabel, esdLabel, aligned, summary, sprintPriorities, esdPriorities };
}

                {coachPasswordChecking ? "Checking..." : "Unlock"}
              </button>
              <p style={{ color: "#5C6469", fontSize: 11, marginTop: 12, marginBottom: 0 }}>
                Checked against a password stored securely on the server — not visible in this page's code. Set/changed via Supabase secrets (COACH_PASSWORD).
              </p>
            </div>
          ) : (
          <>
          <div className="no-print">
            <div style={{ fontSize: 12, color: "#8A9198", textTransform: "uppercase", letterSpacing: 1 }}>Internal tool</div>
            <h2 style={{ fontFamily: "Barlow Condensed, sans-serif", fontSize: 30, textTransform: "uppercase", margin: "2px 0 6px" }}>Coach Tools — Assessment Report Builder</h2>
            <p style={{ color: "#5C6469", fontSize: 12, marginBottom: 20 }}>
              Password-protected via a server-side check — the password itself is never stored in this page's code.
            </p>

            <div className="card" style={{ marginBottom: 20 }}>
              <div style={{ fontSize: 12, letterSpacing: 1, color: "#2D6FE0", textTransform: "uppercase", marginBottom: 12 }}>1. Look up athlete</div>
              <div style={{ display: "flex", gap: 10 }}>
                <input
                  type="email"
                  placeholder="athlete@example.com"
                  value={coachLookupEmail}
                  onChange={(e) => setCoachLookupEmail(e.target.value)}
                />
                <button onClick={lookupAthlete} disabled={coachLoading} style={{ background: "#2D6FE0", color: "#fff", border: "none", padding: "10px 20px", fontSize: 13, cursor: "pointer", whiteSpace: "nowrap" }}>
                  {coachLoading ? "Loading..." : "Pull Data"}
                </button>
              </div>
              {coachError && <p style={{ color: "#E4837B", fontSize: 12, marginTop: 10, marginBottom: 0 }}>{coachError}</p>}
              {!backendReady && <p style={{ color: "#5C6469", fontSize: 12, marginTop: 10, marginBottom: 0 }}>Backend isn't configured yet — this tool needs it to pull real athlete data.</p>}
            </div>

            {coachData && (
              <>
                <div className="card" style={{ marginBottom: 20 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 12 }}>
                    <div style={{ fontSize: 12, letterSpacing: 1, color: "#D8342A", textTransform: "uppercase" }}>2. Movement Quality Scorecard (FMS-style)</div>
                    {scorecardEntries.length > 0 && (
                      <div style={{ fontSize: 13, color: "#E8ECEE" }}>
                        Total: <strong>{scorecardTotal}</strong> / {scorecardMax}
                      </div>
                    )}
                  </div>
                  <p style={{ color: "#5C6469", fontSize: 12, marginBottom: 12 }}>
                    Score each category after reviewing this athlete's Phase 2 videos ({coachData.videoMovementIds.length} of {MOVEMENTS.length} movements uploaded).
                  </p>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginBottom: 16, fontSize: 11, color: "#8A9198" }}>
                    {FMS_SCORES.map((s) => (
                      <div key={s.score} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                        <span style={{ width: 8, height: 8, borderRadius: "50%", background: s.color, display: "inline-block" }} />
                        {s.label}
                      </div>
                    ))}
                  </div>
                  <div style={{ display: "grid", gap: 12 }}>
                    {SCORECARD_CATEGORIES.map((cat) => (
                      <div key={cat}>
                        <label style={{ fontSize: 12, color: "#8A9198" }}>{cat}</label>
                        <div style={{ display: "flex", gap: 6, marginTop: 4 }}>
                          {FMS_SCORES.slice().reverse().map((s) => {
                            const selected = scorecard[cat] === String(s.score);
                            return (
                              <button
                                key={s.score}
                                type="button"
                                onClick={() => setScorecard({ ...scorecard, [cat]: String(s.score) })}
                                title={s.desc}
                                style={{
                                  flex: 1,
                                  padding: "8px 0",
                                  fontSize: 13,
                                  fontWeight: 700,
                                  cursor: "pointer",
                                  background: selected ? s.color : "#161A1D",
                                  color: selected ? "#0F1214" : "#8A9198",
                                  border: selected ? `1px solid ${s.color}` : "1px solid #2C3236",
                                }}
                              >
                                {s.score}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="card" style={{ marginBottom: 20 }}>
                  <div style={{ fontSize: 12, letterSpacing: 1, color: "#6EBF7A", textTransform: "uppercase", marginBottom: 12 }}>3. Findings &amp; Notes</div>
                  <label style={{ fontSize: 12, color: "#8A9198" }}>Mobility &amp; stability findings</label>
                  <textarea rows={3} value={mobilityFindings} onChange={(e) => setMobilityFindings(e.target.value)} style={{ width: "100%", background: "#161A1D", border: "1px solid #2C3236", color: "#E8ECEE", padding: "10px 12px", fontSize: 14, boxSizing: "border-box", marginBottom: 12, fontFamily: "Inter, sans-serif" }} />
                  <label style={{ fontSize: 12, color: "#8A9198" }}>Strength–power profile notes</label>
                  <textarea rows={3} value={strengthNotes} onChange={(e) => setStrengthNotes(e.target.value)} style={{ width: "100%", background: "#161A1D", border: "1px solid #2C3236", color: "#E8ECEE", padding: "10px 12px", fontSize: 14, boxSizing: "border-box", fontFamily: "Inter, sans-serif" }} />
                </div>

                <div className="card" style={{ marginBottom: 20 }}>
                  <div style={{ fontSize: 12, letterSpacing: 1, color: "#2D6FE0", textTransform: "uppercase", marginBottom: 12 }}>4. Training Priority</div>
                  {coachSuggestedSummary && (
                    <p style={{ color: "#8A9198", fontSize: 12, marginBottom: 10 }}>
                      Suggested from ESD + Sprint FV convergence: <strong style={{ color: "#E8ECEE" }}>{coachSuggestedSummary.priority}</strong> — {coachSuggestedSummary.text}
                    </p>
                  )}
                  <select value={priorityOverride} onChange={(e) => setPriorityOverride(e.target.value)}>
                    <option value="">{coachSuggestedSummary ? `Use suggested: ${coachSuggestedSummary.priority}` : "Select a priority"}</option>
                    {ATHLETE_CATEGORIES.map((c) => <option key={c.name} value={c.name}>{c.name}</option>)}
                  </select>
                </div>

                <button onClick={() => setShowReport(true)} style={{ background: "#D8342A", color: "#fff", border: "none", padding: "12px 24px", fontSize: 14, fontWeight: 600, cursor: "pointer", marginBottom: 20 }}>
                  Generate Report
                </button>
              </>
            )}
          </div>

          {coachData && showReport && (
            <div>
              <div className="no-print" style={{ display: "flex", gap: 10, marginBottom: 16 }}>
                <button onClick={() => window.print()} style={{ background: "#2D6FE0", color: "#fff", border: "none", padding: "10px 20px", fontSize: 13, cursor: "pointer" }}>
                  Print / Save as PDF
                </button>
                <a
                  href={`mailto:${coachLookupEmail}?subject=${encodeURIComponent("Your Assessment Report — The Human Performance Blueprint")}&body=${encodeURIComponent("Hi,\n\nYour individualized assessment report is attached.\n\n— Chris\n\n(Remember: use Print / Save as PDF above first, then attach that file here before sending.)")}`}
                  style={{ background: "transparent", border: "1px solid #2C3236", color: "#E8ECEE", padding: "10px 20px", fontSize: 13, textDecoration: "none", display: "inline-flex", alignItems: "center" }}
                >
                  Open Email to {coachLookupEmail}
                </a>
              </div>

              <div id="printable-report" style={{ background: "#fff", color: "#14181B", maxWidth: 700, margin: "0 auto" }}>
                <div style={{ background: "#14181B", padding: "20px 24px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div style={{ fontSize: 11, color: "#8A9198", letterSpacing: 1 }}>THE HUMAN PERFORMANCE BLUEPRINT</div>
                    <div style={{ fontSize: 20, color: "#fff", fontWeight: 700 }}>Assessment Report</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 12, color: "#8A9198" }}>{coachLookupEmail}</div>
                    <div style={{ fontSize: 11, color: "#5C6469" }}>{new Date().toLocaleDateString()}</div>
                  </div>
                </div>

                <div style={{ padding: 24 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10 }}>
                    <div style={{ fontSize: 12, color: "#2D6FE0", fontWeight: 700, letterSpacing: 1 }}>MOVEMENT QUALITY SCORECARD (FMS-STYLE, 0–3)</div>
                    {scorecardEntries.length > 0 && (
                      <div style={{ fontSize: 14, color: "#14181B" }}>
                        Total: <strong>{scorecardTotal}</strong> / {scorecardMax}
                        {scorecardEntries.length < SCORECARD_CATEGORIES.length && (
                          <span style={{ fontSize: 11, color: "#888" }}> ({scorecardEntries.length}/{SCORECARD_CATEGORIES.length} scored)</span>
                        )}
                      </div>
                    )}
                  </div>
                  <div style={{ marginBottom: 24 }}>
                    {SCORECARD_CATEGORIES.filter((c) => scorecard[c] !== undefined && scorecard[c] !== "").map((cat) => {
                      const scoreInfo = FMS_SCORES.find((s) => String(s.score) === scorecard[cat]);
                      return (
                        <div key={cat} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                          <div style={{ width: 130, fontSize: 12 }}>{cat}</div>
                          <div style={{ flex: 1, background: "#EEE", height: 10 }}>
                            <div style={{ width: `${(Number(scorecard[cat]) / 3) * 100}%`, background: scoreInfo ? scoreInfo.color : "#2D6FE0", height: 10 }} />
                          </div>
                          <div style={{ width: 40, fontSize: 12, textAlign: "right" }}>{scorecard[cat]}/3</div>
                        </div>
                      );
                    })}
                    {SCORECARD_CATEGORIES.filter((c) => scorecard[c] !== undefined && scorecard[c] !== "").length === 0 && (
                      <p style={{ fontSize: 12, color: "#888" }}>No scores entered yet.</p>
                    )}
                  </div>

                  {SCORECARD_CATEGORIES.some((c) => scorecard[c] === "0") && (
                    <div style={{ background: "#FBE9E7", border: "1px solid #D8342A", padding: 12, marginBottom: 24 }}>
                      <p style={{ fontSize: 12, color: "#B02A20", fontWeight: 700, margin: 0 }}>
                        Pain reported during one or more movements (score of 0) — recommend further medical evaluation before proceeding with corrective or performance programming for that movement pattern.
                      </p>
                    </div>
                  )}

                  <div style={{ fontSize: 12, color: "#D8342A", fontWeight: 700, letterSpacing: 1, marginBottom: 8 }}>MOBILITY &amp; STABILITY FINDINGS</div>
                  <p style={{ fontSize: 13, lineHeight: 1.6, marginBottom: 24, whiteSpace: "pre-wrap" }}>{mobilityFindings || "—"}</p>

                  <div style={{ fontSize: 12, color: "#D8342A", fontWeight: 700, letterSpacing: 1, marginBottom: 8 }}>STRENGTH–POWER PROFILE</div>
                  <p style={{ fontSize: 13, lineHeight: 1.6, marginBottom: 24, whiteSpace: "pre-wrap" }}>{strengthNotes || "—"}</p>

                  <div style={{ fontSize: 12, color: "#2D6FE0", fontWeight: 700, letterSpacing: 1, marginBottom: 8 }}>EXPLOSIVE STRENGTH ANALYSIS (SJ VS. CMJ)</div>
                  {coachEsd !== null ? (
                    <div style={{ marginBottom: 24 }}>
                      <p style={{ fontSize: 13, margin: "0 0 4px" }}>SJ: {coachTest.sj} · CMJ: {coachTest.cmj} · <strong>ESD: {coachEsd.toFixed(1)}%</strong></p>
                      <p style={{ fontSize: 12, color: "#555" }}>{coachEsdInterp.label} — {coachEsdInterp.detail}</p>
                    </div>
                  ) : (
                    <p style={{ fontSize: 12, color: "#888", marginBottom: 24 }}>No jump testing data on file.</p>
                  )}

                  <div style={{ fontSize: 12, color: "#2D6FE0", fontWeight: 700, letterSpacing: 1, marginBottom: 8 }}>SPRINT PROFILE (FV)</div>
                  {coachFV ? (
                    <div style={{ marginBottom: 24 }}>
                      <p style={{ fontSize: 13, margin: "0 0 4px" }}>
                        10yd: {coachTest.sprint10}s · 20yd: {coachTest.sprint20}s · 30yd: {coachTest.sprint30}s · 40yd: {coachTest.sprint40}s
                      </p>
                      <p style={{ fontSize: 13, margin: "0 0 4px" }}><strong>{coachFV.label}</strong></p>
                      <p style={{ fontSize: 12, color: "#555" }}>{coachFV.detail}</p>
                      {coachFV.force && (
                        <p style={{ fontSize: 12, color: "#555" }}>
                          Peak force: {coachFV.force.Fmax.toFixed(0)} N ({coachFV.force.FmaxPerKg.toFixed(1)} N/kg) · Peak power: {coachFV.force.Pmax.toFixed(0)} W ({coachFV.force.PmaxPerKg.toFixed(1)} W/kg)
                        </p>
                      )}
                    </div>
                  ) : (
                    <p style={{ fontSize: 12, color: "#888", marginBottom: 24 }}>No sprint testing data on file.</p>
                  )}

                  <div style={{ background: "#1B2A45", padding: 16, marginBottom: combinedProfile ? 24 : 0 }}>
                    <div style={{ fontSize: 12, color: "#8FA8D9", fontWeight: 700, letterSpacing: 1, marginBottom: 6 }}>TRAINING PRIORITY</div>
                    <div style={{ fontSize: 16, color: "#14181B", fontWeight: 700 }}>{finalPriority || "Not yet determined"}</div>
                  </div>

                  {combinedProfile && (
                    <div style={{ background: "#DCE9F9", border: "1px solid #B8D2ED", padding: 16 }}>
                      <div style={{ fontSize: 13, color: "#1B3A5C", fontWeight: 700, marginBottom: 10 }}>⊙ COMBINED ATHLETIC PROFILE — SPRINT F-V + ESD</div>
                      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
                        <span style={{ background: "#FBE0DC", color: "#B02A20", fontSize: 12, fontWeight: 700, padding: "6px 12px" }}>Sprint: {combinedProfile.sprintLabel}</span>
                        <span style={{ background: "#DCE9F9", border: "1px solid #B8D2ED", color: "#1B3A5C", fontSize: 12, fontWeight: 700, padding: "6px 12px" }}>ESD: {combinedProfile.esdLabel}</span>
                        <span style={{ background: "#fff", border: "1px solid #D5D9DB", color: "#333", fontSize: 12, fontWeight: 700, padding: "6px 12px" }}>
                          {combinedProfile.aligned ? "Aligned signals" : "Mixed signals"}
                        </span>
                      </div>
                      <div style={{ background: "#fff", padding: 12, marginBottom: 12, fontSize: 13, color: "#222", lineHeight: 1.5 }}>
                        {combinedProfile.summary}
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                        <div style={{ background: "#FBE9E7", padding: 12 }}>
                          <div style={{ fontSize: 12, color: "#B02A20", fontWeight: 700, marginBottom: 6 }}>Sprint F-V priorities</div>
                          <ol style={{ margin: 0, paddingLeft: 16, fontSize: 12, color: "#333", lineHeight: 1.7 }}>
                            {combinedProfile.sprintPriorities.map((p) => <li key={p}>{p}</li>)}
                          </ol>
                        </div>
                        <div style={{ background: "#DCE9F9", padding: 12 }}>
                          <div style={{ fontSize: 12, color: "#1B3A5C", fontWeight: 700, marginBottom: 6 }}>ESD prescription</div>
                          <ol style={{ margin: 0, paddingLeft: 16, fontSize: 12, color: "#333", lineHeight: 1.7 }}>
                            {combinedProfile.esdPriorities.map((p) => <li key={p}>{p}</li>)}
                          </ol>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                <div style={{ background: "#14181B", padding: "12px 24px", textAlign: "center" }}>
                  <span style={{ fontSize: 11, color: "#8FA8D9", letterSpacing: 1 }}>ASSESS. PLAN. TRAIN. PERFORM.</span>
                </div>
              </div>
            </div>
          )}
          </>
          )}
        </div>
      )}

      {paymentPlan && (
        <div
          onClick={() => { setPaymentPlan(null); setIntakeAwaitingPayment(false); }}
          style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 20 }}
        >
          <div onClick={(e) => e.stopPropagation()} className="card" style={{ maxWidth: 420, width: "100%", position: "relative" }}>
            <button onClick={() => { setPaymentPlan(null); setIntakeAwaitingPayment(false); }} style={{ position: "absolute", top: 12, right: 12, background: "transparent", border: "none", color: "#8A9198", fontSize: 18, cursor: "pointer", lineHeight: 1 }}>×</button>
            <div style={{ fontSize: 12, letterSpacing: 1, color: "#2D6FE0", textTransform: "uppercase", marginBottom: 6 }}>{PLANS[paymentPlan].label}</div>
            <div style={{ fontFamily: "Barlow Condensed, sans-serif", fontSize: 30, fontWeight: 700, marginBottom: 16 }}>{PLANS[paymentPlan].price}</div>

            {backendReady ? (
              <>
                <label style={{ fontSize: 12, color: "#8A9198" }}>Email (for your receipt and account)</label>
                <input
                  type="email"
                  placeholder="you@example.com"
                  value={profile.email || checkoutEmail}
                  onChange={(e) => { setCheckoutEmail(e.target.value); setProfile({ ...profile, email: e.target.value }); }}
                  style={{ marginBottom: 14 }}
                />
                <button
                  disabled={!(profile.email || checkoutEmail) || checkoutStatus === "checking"}
                  onClick={async () => {
                    const email = profile.email || checkoutEmail;
                    setCheckoutStatus("checking");
                    const url = await startCheckout(paymentPlan, email);
                    setCheckoutStatus("");
                    if (url) { window.location.href = url; }
                    else { setCheckoutStatus("error"); }
                  }}
                  style={{
                    width: "100%", background: "#635BFF", color: "#fff", border: "none", padding: "12px",
                    fontSize: 14, fontWeight: 600, cursor: (profile.email || checkoutEmail) ? "pointer" : "default",
                    opacity: (profile.email || checkoutEmail) ? 1 : 0.5,
                  }}
                >
                  {checkoutStatus === "checking" ? "Redirecting to Stripe..." : "Pay with Stripe"}
                </button>
                {checkoutStatus === "error" && (
                  <p style={{ color: "#E4837B", fontSize: 12, marginTop: 8, marginBottom: 0, textAlign: "center" }}>
                    Something went wrong starting checkout. Check the Edge Function logs.
                  </p>
                )}
              </>
            ) : (
              <div style={{ display: "grid", gap: 10 }}>
                {PLANS[paymentPlan].stripeUrl ? (
                  <a href={PLANS[paymentPlan].stripeUrl} target="_blank" rel="noreferrer" style={{ display: "block", textAlign: "center", background: "#635BFF", color: "#fff", padding: "12px", fontSize: 14, fontWeight: 600, textDecoration: "none" }}>
                    Pay with Stripe
                  </a>
                ) : (
                  <div style={{ background: "#161A1D", border: "1px dashed #2C3236", color: "#5C6469", padding: "12px", fontSize: 12, textAlign: "center" }}>
                    Backend not configured yet — see SETUP-GUIDE.md
                  </div>
                )}
              </div>
            )}

            <div style={{ borderTop: "1px solid #23282C", marginTop: 18, paddingTop: 14 }}>
              <button
                onClick={() => {
                  setSubscribed(paymentPlan);
                  setPaymentPlan(null);
                  if (intakeAwaitingPayment && paymentPlan === "programming") {
                    setIntakePhase(4);
                    setIntakeAwaitingPayment(false);
                  }
                }}
                style={{ width: "100%", background: "transparent", border: "1px solid #2C3236", color: "#8A9198", padding: "10px", fontSize: 12, cursor: "pointer" }}
              >
                Simulate successful payment (demo only)
              </button>
              <p style={{ color: "#5C6469", fontSize: 11, marginTop: 10, marginBottom: 0, textAlign: "center" }}>
                {backendReady ? "Simulate skips real Stripe checkout — for testing only." : "Real checkout requires the backend to be configured — see SETUP-GUIDE.md."}
              </p>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
