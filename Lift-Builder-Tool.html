<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lift Builder — The Human Performance Blueprint</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F1214;--bg2:#171B1E;--bg3:#1E2327;--bg4:#262B2F;
  --t1:#E8ECEE;--t2:#8A9198;--t3:#5C6469;
  --b1:rgba(255,255,255,.10);--b2:rgba(255,255,255,.18);--b3:rgba(255,255,255,.28);
  --blue:#2D6FE0;--bmid:#4E86EA;--bbg:#1B2A45;
  --red:#D8342A;--rbg:#3A1F1D;--rdark:#E4837B;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
.app-header{background:#14181B;color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.app-title-sub{font-size:10px;color:#8A9198;text-transform:uppercase;letter-spacing:.5px}
.app-title{font-size:17px;font-weight:600}
.header-date{font-size:11px;color:#B2B8BC;background:rgba(255,255,255,.08);padding:4px 12px;border-radius:20px}
.content{padding:18px 22px;max-width:1040px;margin:0 auto}
.card{background:var(--bg2);border:.5px solid var(--b1);border-radius:10px;padding:14px 16px}
.sec-title{font-size:11px;font-weight:500;color:var(--t2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
select,input[type=number],input[type=text],input[type=date]{width:100%;padding:7px 10px;border-radius:7px;font-size:12px;border:.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-family:inherit}
select:focus,input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(45,111,224,.12)}
.btn{padding:8px 18px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-family:inherit;transition:background .12s}
.btn:hover{background:var(--bg3)}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:#1E56B8}
.btn-ghost{color:var(--t2);border-color:var(--b1);background:transparent}
.btn-ghost:hover{background:var(--bg3)}
.btn-sm{padding:5px 11px;font-size:11px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.form-label{font-size:11px;color:var(--t2);display:block;margin-bottom:4px;font-weight:500}
.form-section{background:var(--bg3);border-radius:10px;padding:14px;margin-bottom:14px}
.form-section-title{font-size:13px;font-weight:500;margin-bottom:12px}
.subtab-btn{padding:6px 13px;border-radius:7px;font-size:12px;cursor:pointer;border:.5px solid var(--b1);background:transparent;color:var(--t2);font-family:inherit}
.subtab-btn.active{background:var(--bg2);color:var(--t1);font-weight:500;border-color:var(--b2);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.subtab-btn:disabled{opacity:.4;cursor:not-allowed}
.toast{position:fixed;bottom:20px;right:20px;background:#1a1a1a;color:#fff;padding:9px 16px;border-radius:7px;font-size:12px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.kpi-table{width:100%;border-collapse:collapse;font-size:12px}
.kpi-table th{text-align:left;padding:6px 8px;background:var(--bg3);font-weight:500;font-size:11px;color:var(--t2);border-bottom:.5px solid var(--b1)}
.kpi-table td{padding:7px 8px;border-bottom:.5px solid var(--b1)}
.kpi-table tr:last-child td{border-bottom:none}
.kpi-table tr:hover td{background:var(--bg3)}
@media print{
  body{background:#fff}.app-header,.no-print{display:none!important}
  .content{padding:0;max-width:100%}
  .card{box-shadow:none;border:.5px solid #ccc;break-inside:avoid}
}
</style>
</head>
<body>
<div class="app-header">
  <div style="display:flex;align-items:center;gap:12px">
    <img src="" id="header-logo" alt="The Human Performance Blueprint" style="height:44px">
    <div>
      <div class="app-title">Lift Builder</div>
      <div class="app-title-sub">The Human Performance Blueprint · Internal Tool</div>
    </div>
  </div>
  <div class="header-date" id="header-date"></div>
</div>
<div class="content" id="app"></div>
<div class="toast" id="toast"></div>

function ls(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function todayStr(){return new Date().toISOString().split("T")[0];}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function uid2(){return Math.random().toString(36).slice(2,9);}

function findLS(id){return LIFT_SESSIONS.find(s=>s.id===id);}
function findLB(s,bid){return s.blocks.find(b=>b.id===bid);}

function newExRow(){return{id:uid2(),order:"",name:"",exId:null,sets:"3",reps:"5",dur:"—",dist:"—",load:"—",rir:"—",tempo:"—",rest:"—",notes:""};}

function createLS(data){
  const s={id:uid2(),title:data.title||"New Session",athleteName:data.athleteName||"",
    date:data.date||todayStr(),focus:data.focus||"",
    blocks:[{id:uid2(),type:"warmup",name:"Warm-Up",
      subs:WU_SUBS.map(n=>({name:n,exercises:[]})),exercises:[]}]};
  LIFT_SESSIONS.unshift(s);saveLiftSessions();return s.id;
}

window.setLiftSubTab=function(v){liftSubTab=v;renderContent();};
window.setLiftSession=function(id){liftSessionId=id;liftSubTab="builder";renderContent();};
window.deleteLiftSession=function(id){
  if(!confirm("Delete this session?"))return;
  LIFT_SESSIONS=LIFT_SESSIONS.filter(s=>s.id!==id);
  saveLiftSessions();if(liftSessionId===id)liftSessionId=null;renderContent();
};
window.duplicateLS=function(id){
  const s=findLS(id);if(!s)return;
  const c=JSON.parse(JSON.stringify(s));c.id=uid2();c.title=s.title+" (copy)";
  LIFT_SESSIONS.unshift(c);saveLiftSessions();renderContent();
};
window.createNewLS=function(){
  const g=id=>document.getElementById(id)?.value||"";
  const id=createLS({title:g("ls-title")||"New Session",
    athleteName:g("ls-athlete"),date:g("ls-date")||todayStr(),focus:g("ls-focus")});
  liftSessionId=id;liftSubTab="builder";renderContent();
};
window.addLiftBlock=function(sid,type){
  const s=findLS(sid);if(!s)return;
  const bt=BLOCK_TYPES.find(b=>b.key===type)||BLOCK_TYPES[2];
  const n=s.blocks.filter(b=>b.type!=="warmup").length+1;
  const b={id:uid2(),type,name:"Block "+n+" — "+bt.label,subs:type==="warmup"?WU_SUBS.map(n=>({name:n,exercises:[]})):null,exercises:[],superNote:"",rest:""};
  s.blocks.push(b);saveLiftSessions();renderContent();
};
window.deleteLiftBlock=function(sid,bid){
  if(!confirm("Remove this block?"))return;
  const s=findLS(sid);if(!s)return;
  s.blocks=s.blocks.filter(b=>b.id!==bid);saveLiftSessions();renderContent();
};
window.addLiftEx=function(sid,bid,sub){
  const s=findLS(sid);if(!s)return;
  const b=findLB(s,bid);if(!b)return;
  const ex=newExRow();
  if(sub!==null&&sub!==undefined&&sub!==""&&b.subs){b.subs[parseInt(sub)].exercises.push(ex);}
  else{b.exercises.push(ex);}
  saveLiftSessions();renderContent();
};
window.removeLiftEx=function(sid,bid,exid,sub){
  const s=findLS(sid);if(!s)return;
  const b=findLB(s,bid);if(!b)return;
  if(sub!==null&&sub!==undefined&&sub!==""&&b.subs){b.subs[parseInt(sub)].exercises=b.subs[parseInt(sub)].exercises.filter(e=>e.id!==exid);}
  else{b.exercises=b.exercises.filter(e=>e.id!==exid);}
  saveLiftSessions();renderContent();
};
window.saveLF=function(sid,bid,eid,field,val,sub){
  const s=findLS(sid);if(!s)return;
  const b=findLB(s,bid);if(!b)return;
  let arr=b.exercises;
  if(sub!==null&&sub!==undefined&&sub!==""&&b.subs)arr=b.subs[parseInt(sub)].exercises;
  const ex=arr.find(e=>e.id===eid);if(ex)ex[field]=val;
  saveLiftSessions();
};
window.saveBF=function(sid,bid,field,val){
  const s=findLS(sid);if(!s)return;
  const b=findLB(s,bid);if(!b)return;
  b[field]=val;saveLiftSessions();
};
window.saveSF=function(sid,field,val){
  const s=findLS(sid);if(!s)return;
  s[field]=val;saveLiftSessions();
};

// Exercise library CRUD
window.addExToLib=function(){
  const g=id=>document.getElementById(id)?.value||"";
  if(!g("elib-name")){showToast("Exercise name required.");return;}
  const ex={id:uid2(),name:g("elib-name"),pattern:g("elib-pattern"),type:g("elib-type"),
    quality:g("elib-quality"),notes:g("elib-notes"),videoUrl:g("elib-video"),videoFile:null};
  EXERCISE_LIBRARY.unshift(ex);saveExLib();showToast("Exercise added to library.");renderContent();
};
window.deleteExFromLib=function(id){
  if(!confirm("Remove this exercise?"))return;
  EXERCISE_LIBRARY=EXERCISE_LIBRARY.filter(e=>e.id!==id);saveExLib();renderContent();
};
window.uploadExVideo=function(input,id){
  const file=input.files[0];if(!file)return;
  if(file.size>8*1024*1024){showToast("Video too large (max 8MB). Use a URL instead.");return;}
  const reader=new FileReader();
  reader.onload=e=>{
    const ex=EXERCISE_LIBRARY.find(x=>x.id===id);
    if(ex){ex.videoFile=e.target.result;saveExLib();showToast("Video uploaded.");renderContent();}
  };
  reader.readAsDataURL(file);
};
window.insertLibEx=function(sid,bid,rowId,exId,sub){
  const s=findLS(sid);if(!s)return;
  const b=findLB(s,bid);if(!b)return;
  const libEx=EXERCISE_LIBRARY.find(e=>e.id===exId);if(!libEx)return;
  let arr=b.exercises;
  if(sub!==null&&sub!==undefined&&sub!==""&&b.subs)arr=b.subs[parseInt(sub)].exercises;
  const ex=arr.find(e=>e.id===rowId);
  if(ex){
    ex.name=libEx.name;
    ex.exId=exId;
    if(libEx.notes&&!ex.notes)ex.notes=libEx.notes;
  }
  saveLiftSessions();renderContent();
};
window.updateExName=function(sid,bid,rowId,val,sub){
  const s=findLS(sid);if(!s)return;
  const b=findLB(s,bid);if(!b)return;
  let arr=b.exercises;
  if(sub!==null&&sub!==undefined&&sub!==""&&b.subs)arr=b.subs[parseInt(sub)].exercises;
  const ex=arr.find(e=>e.id===rowId);if(!ex)return;
  ex.name=val;
  const libEx=EXERCISE_LIBRARY.find(x=>x.name.toLowerCase()===val.toLowerCase());
  if(libEx){ex.exId=libEx.id;if(libEx.notes&&!ex.notes)ex.notes=libEx.notes;}
  saveLiftSessions();
};
window.printLiftSession=function(id){
  const s=findLS(id);if(!s){showToast("Session not found.");return;}
  const html=buildWorkoutCardHTML(s);
  const w=window.open("","_blank");
  w.document.write(html);w.document.close();
  setTimeout(()=>{w.focus();w.print();},500);
};
window.exportExLibrary=function(){
  if(!EXERCISE_LIBRARY.length){showToast("Library is empty — nothing to export.");return;}
  const json=JSON.stringify({version:1,exported:new Date().toISOString(),exercises:EXERCISE_LIBRARY},null,2);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));
  a.download="hpb_exercise_library_"+new Date().toISOString().split("T")[0]+".json";
  a.click();
  showToast(`Exported ${EXERCISE_LIBRARY.length} exercises.`);
};
window.importExLibrary=function(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      const incoming=data.exercises||data;
      if(!Array.isArray(incoming)||!incoming.length){showToast("No exercises found in file.");return;}
      let added=0,skipped=0;
      incoming.forEach(ex=>{
        const exists=EXERCISE_LIBRARY.some(x=>x.name.toLowerCase()===ex.name.toLowerCase());
        if(exists){skipped++;return;}
        if(!ex.id)ex.id=uid2();
        EXERCISE_LIBRARY.push(ex);
        added++;
      });
      saveExLib();
      showToast(`Imported ${added} exercise${added!==1?"s":""}${skipped?` · ${skipped} duplicate${skipped!==1?"s":""} skipped`:""}.`);
      input.value="";
      renderContent();
    }catch(err){showToast("Invalid file — could not parse JSON.");}
  };
  reader.readAsText(file);
};

          <div><label class="form-label">Video URL</label>
            <input type="text" id="elib-edit-video" value="${e.videoUrl||""}" placeholder="https://…" style="width:100%"></div>
          <div><label class="form-label">Coaching notes</label>
            <input type="text" id="elib-edit-notes" value="${e.notes||""}" placeholder="Key cues…" style="width:100%"></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary btn-sm" onclick="saveEditLibEx('${e.id}')">Save changes</button>
          <button class="btn btn-ghost btn-sm" onclick="cancelEditLibEx()">Cancel</button>
        </div>
      </div>`;
    }

    return`<div style="display:flex;align-items:center;gap:10px;background:var(--bg2);border:.5px solid var(--b1);border-radius:9px;padding:10px 14px;margin-bottom:8px;flex-wrap:wrap">
      <div style="flex:1;min-width:180px">
        <div style="font-size:12px;font-weight:500">${e.name}</div>
        <div style="font-size:10px;color:var(--t2);margin-top:2px">${pLabel} · ${tLabel} · ${qLabel}</div>
        ${e.notes?`<div style="font-size:10px;color:var(--t3);margin-top:2px;font-style:italic">${e.notes}</div>`:""}
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        ${e.videoUrl?`<a href="${e.videoUrl}" target="_blank" class="btn btn-ghost btn-sm" style="font-size:10px">▶ Video</a>`:
          e.videoFile?`<video src="${e.videoFile}" controls style="width:80px;height:48px;border-radius:5px"></video>`:""}
        <label class="btn btn-ghost btn-sm" style="font-size:10px;cursor:pointer">
          📎 Upload video
          <input type="file" accept="video/*,image/*" onchange="uploadExVideo(this,'${e.id}')" style="display:none">
        </label>
        <button class="btn btn-ghost btn-sm" onclick="startEditLibEx('${e.id}')">✏ Edit</button>
        <button class="btn btn-ghost btn-sm" style="color:#E4837B" onclick="deleteExFromLib('${e.id}')">✕</button>
      </div>
    </div>`;
  }).join(""):`<div style="font-size:11px;color:var(--t3);font-style:italic;padding:16px 0">${liftLibSearchVal?"No exercises match your search.":"Library is empty — add exercises above."}</div>`}`;
}

// ── Printable workout card HTML (standalone) ──────────────────
function buildWorkoutCardHTML(s){
  const athleteLabel=s.athleteName?`${s.athleteName} — `:"";
  function tbl(headers,rows){
    return`<table border="0" cellpadding="4" cellspacing="0" style="width:100%;border-collapse:collapse;margin-bottom:4px;font-size:11px">
      <thead><tr style="border-bottom:1px solid #333">${headers.map(h=>`<th style="text-align:left;font-size:10px;padding:3px 5px;background:#f0f0f0">${h}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }
  function blockHTML(b){
    const bt=BLOCK_TYPES.find(x=>x.key===b.type)||BLOCK_TYPES[2];
    const isWU=b.type==="warmup";
    let inner="";
    if(isWU&&b.subs){
      inner=b.subs.map(sub=>{
        if(!sub.exercises.length)return"";
        return`<tr><td colspan="7" style="padding:5px 5px 2px;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#555;background:#f8f8f8">${sub.name}</td></tr>`
          +sub.exercises.map(e=>`<tr style="border-bottom:.5px solid #eee">
            <td style="padding:3px 5px;font-weight:700;width:30px">${e.order}</td>
            <td style="padding:3px 5px">${e.name}</td>
            <td style="padding:3px 5px;white-space:nowrap">${e.sets!=="—"?e.sets+" x":""} ${e.reps!=="x"?e.reps:""}</td>
            <td style="padding:3px 5px">${e.dur!=="—"?e.dur:""}</td>
            <td style="padding:3px 5px">${e.dist!=="—"?e.dist:""}</td>
            <td style="padding:3px 5px">${e.load!=="—"?e.load:""}</td>
            <td style="padding:3px 5px">${e.notes}</td>
          </tr>`).join("");
      }).join("");
    } else {
      inner=b.exercises.map(e=>{
        const libEx=e.exId?EXERCISE_LIBRARY.find(x=>x.id===e.exId):null;
        const notesDisplay=e.notes||(libEx?.notes||"");
        return`<tr style="border-bottom:.5px solid #eee">
          <td style="padding:3px 5px;font-weight:700;width:30px">${e.order}</td>
          <td style="padding:3px 5px">${e.name}</td>
          <td style="padding:3px 5px;white-space:nowrap">${e.sets!=="—"&&e.sets?e.sets+" x ":""} ${e.reps!=="x"?e.reps:""} ${e.rir!=="—"&&e.rir?"("+e.rir+")" :""}</td>
          <td style="padding:3px 5px">${e.dur!=="—"?e.dur:""}</td>
          <td style="padding:3px 5px">${e.load!=="—"?e.load:""}</td>
          <td style="padding:3px 5px">${e.tempo!=="—"?e.tempo:""}</td>
          <td style="padding:3px 5px">${notesDisplay}</td>
        </tr>`;
      }).join("");
    }
    const headers=isWU?["Order","Exercise","Sets x Reps","Duration","Distance","Load","Notes"]
                      :["Order","Exercise","Sets x Reps (RIR)","Duration","Load","Tempo","Notes"];
    return`<div style="margin-bottom:10px;border:1px solid #ccc;border-radius:4px;overflow:hidden;page-break-inside:avoid">
      <div style="background:${bt.c};padding:5px 10px;display:flex;justify-content:space-between;align-items:center">
        <span style="color:#fff;font-weight:700;font-size:12px">${b.name}</span>
        ${b.superNote?`<span style="color:rgba(255,255,255,.85);font-size:10px">${b.superNote}</span>`:""}
      </div>
      ${inner?tbl(headers,inner):"<p style='padding:5px 10px;font-size:10px;color:#888;font-style:italic'>No exercises added.</p>"}
    </div>`;
  }
  const rpeHTML=`<table border="0" cellpadding="3" cellspacing="0" style="width:140px;border-collapse:collapse;font-size:10px">
    <tr><td colspan="3" style="background:#1a1a1a;color:#fff;font-weight:700;text-align:center;padding:4px">RPE &nbsp;&nbsp;&nbsp;&nbsp; RIR</td></tr>
    ${RPE_RIR.map(r=>`<tr style="background:${r.c}"><td style="color:${r.tc};font-weight:700;width:30px;text-align:center;padding:3px">${r.rpe}</td><td style="color:${r.tc};font-weight:700;text-align:center;flex:1;padding:3px">${r.label}</td><td style="color:${r.tc};font-weight:700;width:30px;text-align:center;padding:3px">${r.rir}</td></tr>`).join("")}
  </table>`;
  return`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${s.title}</title>
  <style>
    *{box-sizing:border-box}body{font-family:Arial,sans-serif;font-size:12px;margin:0;padding:16px;color:#1a1a1a}
    table{border-collapse:collapse}th{text-align:left}
    @media print{body{padding:8px}@page{size:letter;margin:.5in}}
  </style></head><body>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;border-bottom:2px solid #1a1a1a;padding-bottom:8px">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="background:#0F1214;border-radius:8px;padding:6px 8px;line-height:0"><img src="data:image/png;base64,${LOGO_B64}" alt="" style="height:46px;display:block"></div>
      <div>
        <div style="font-size:18px;font-weight:700">${athleteLabel}${s.title}</div>
        <div style="font-size:11px;color:#555;margin-top:3px">Date: ${s.date} &nbsp;|&nbsp; Focus: ${s.focus||"—"} &nbsp;|&nbsp; ${s.athleteName?s.athleteName:"Template session"}</div>
      </div>
    </div>
    <div>${rpeHTML}</div>
  </div>
  ${s.blocks.map(b=>blockHTML(b)).join("")}
  <div style="margin-top:16px;font-size:9px;color:#888;border-top:.5px solid #ccc;padding-top:6px">
    Generated by The Human Performance Blueprint — Lift Builder · ${new Date().toLocaleDateString()}
  </div>
  </body></html>`;
}

// ── Taxonomy CRUD ────────────────────────────────────────────
window.addTaxonomyItem=function(store){
  const labelEl=document.getElementById("tax-"+store+"-label");
  if(!labelEl||!labelEl.value.trim()){showToast("Enter a label first.");return;}
  const label=labelEl.value.trim();
  const key=label.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  if(store==="pattern"){
    if(EX_PATTERNS.find(e=>e.key===key)){showToast("Pattern already exists.");return;}
    EX_PATTERNS.push({key,label});saveExPatterns();
  } else if(store==="type"){
    if(EX_TYPES.find(e=>e.key===key)){showToast("Type already exists.");return;}
    EX_TYPES.push({key,label});saveExTypes();
  } else if(store==="quality"){
    if(STR_QUALITIES.find(e=>e.key===key)){showToast("Quality already exists.");return;}
    STR_QUALITIES.push({key,label});saveStrQualities();
  }
  labelEl.value="";
  showToast(`"${label}" added.`);
  renderContent();
};
window.updateTaxonomyItem=function(store,key,newLabel){
  if(!newLabel.trim())return;
  if(store==="pattern"){
    const e=EX_PATTERNS.find(x=>x.key===key);if(e){e.label=newLabel.trim();saveExPatterns();}
  } else if(store==="type"){
    const e=EX_TYPES.find(x=>x.key===key);if(e){e.label=newLabel.trim();saveExTypes();}
  } else if(store==="quality"){
    const e=STR_QUALITIES.find(x=>x.key===key);if(e){e.label=newLabel.trim();saveStrQualities();}
  }
  showToast("Updated.");
};
window.deleteTaxonomyItem=function(store,key){
  let used=false;
  if(store==="pattern")used=EXERCISE_LIBRARY.some(e=>e.pattern===key);
  if(store==="type")used=EXERCISE_LIBRARY.some(e=>e.type===key);
  if(store==="quality")used=EXERCISE_LIBRARY.some(e=>e.quality===key);
  if(used&&!confirm(`This ${store} is used by exercises in your library. Remove anyway?`))return;
  if(!confirm("Delete this item? This cannot be undone."))return;
  if(store==="pattern"){EX_PATTERNS=EX_PATTERNS.filter(x=>x.key!==key);saveExPatterns();}
  else if(store==="type"){EX_TYPES=EX_TYPES.filter(x=>x.key!==key);saveExTypes();}
  else if(store==="quality"){STR_QUALITIES=STR_QUALITIES.filter(x=>x.key!==key);saveStrQualities();}
  showToast("Deleted.");
  renderContent();
};
window.resetTaxonomy=function(store){
  if(!confirm("Reset to defaults? Any custom entries will be lost."))return;
  if(store==="pattern"){EX_PATTERNS=JSON.parse(JSON.stringify(DEFAULT_EX_PATTERNS));saveExPatterns();}
  else if(store==="type"){EX_TYPES=JSON.parse(JSON.stringify(DEFAULT_EX_TYPES));saveExTypes();}
  else if(store==="quality"){STR_QUALITIES=JSON.parse(JSON.stringify(DEFAULT_STR_QUALITIES));saveStrQualities();}
  showToast("Reset to defaults.");
  renderContent();
};

function liftTaxonomyView(){
  function taxonomySection(title,store,items,defaultItems){
    const isDefault=JSON.stringify(items.map(x=>x.key).sort())===JSON.stringify(defaultItems.map(x=>x.key).sort());
    return`
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">
        <div class="sec-title" style="margin-bottom:0">${title} <span style="font-size:10px;font-weight:400;color:var(--t2)">(${items.length} entries)</span></div>
        ${!isDefault?`<button class="btn btn-ghost btn-sm" style="font-size:10px;color:#E4837B" onclick="resetTaxonomy('${store}')">↺ Reset to defaults</button>`:""}
      </div>
      <table class="kpi-table" style="margin-bottom:10px">
        <thead><tr><th>Label</th><th>Key</th><th>Used in library</th><th>Edit</th><th></th></tr></thead>
        <tbody>
          ${items.map(e=>{
            const usedCount=store==="pattern"?EXERCISE_LIBRARY.filter(x=>x.pattern===e.key).length
              :store==="type"?EXERCISE_LIBRARY.filter(x=>x.type===e.key).length
              :EXERCISE_LIBRARY.filter(x=>x.quality===e.key).length;
            return`<tr>
              <td style="font-weight:500">${e.label}</td>
              <td style="font-family:monospace;font-size:10px;color:var(--t3)">${e.key}</td>
              <td style="font-size:11px;color:var(--t2)">${usedCount>0?`${usedCount} exercise${usedCount>1?"s":""}`:"—"}</td>
              <td>
                <input type="text" value="${e.label}"
                  onchange="updateTaxonomyItem('${store}','${e.key}',this.value)"
                  style="width:180px;font-size:11px;padding:3px 7px;border:.5px solid var(--b1);border-radius:5px;background:var(--bg2)">
              </td>
              <td>
                <button onclick="deleteTaxonomyItem('${store}','${e.key}')"
                  style="color:#E4837B;background:none;border:none;cursor:pointer;font-size:14px" title="Delete">✕</button>
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="text" id="tax-${store}-label" placeholder="New ${title.toLowerCase()} label…"
          style="flex:1;max-width:280px;padding:6px 10px;border:.5px solid var(--b1);border-radius:7px;font-size:12px;background:var(--bg2)"
          onkeydown="if(event.key==='Enter')addTaxonomyItem('${store}')">
        <button class="btn btn-primary btn-sm" onclick="addTaxonomyItem('${store}')">+ Add</button>
      </div>
    </div>`;
  }
  return`
  <div style="font-size:12px;color:var(--t2);margin-bottom:14px;line-height:1.6">
    Manage the dropdown options for exercise patterns, types, and strength qualities used throughout the lift builder and exercise library.
  </div>
  ${taxonomySection("Exercise Patterns","pattern",EX_PATTERNS,DEFAULT_EX_PATTERNS)}
  ${taxonomySection("Exercise Types","type",EX_TYPES,DEFAULT_EX_TYPES)}
  ${taxonomySection("Strength Qualities","quality",STR_QUALITIES,DEFAULT_STR_QUALITIES)}`;
}

// ── Main render loop ────────────────────────────────────────────
function renderContent(){
  const app=document.getElementById("app");
  app.innerHTML=`
  <div style="display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap">
    <button class="subtab-btn${liftSubTab==="sessions"?" active":""}" onclick="setLiftSubTab('sessions')">Sessions</button>
    <button class="subtab-btn${liftSubTab==="builder"?" active":""}" onclick="setLiftSubTab('builder')" ${!liftSessionId?"disabled":""}>Builder</button>
    <button class="subtab-btn${liftSubTab==="library"?" active":""}" onclick="setLiftSubTab('library')">Exercise Library</button>
    <button class="subtab-btn${liftSubTab==="taxonomy"?" active":""}" onclick="setLiftSubTab('taxonomy')">Taxonomy</button>
  </div>
  ${liftSubTab==="sessions"?liftSessionsView():liftSubTab==="library"?liftLibraryView():liftSubTab==="taxonomy"?liftTaxonomyView():liftBuilderView()}`;
}

document.getElementById("header-logo").src=`data:image/png;base64,${LOGO_B64}`;
document.getElementById("header-date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
renderContent();
</script>
