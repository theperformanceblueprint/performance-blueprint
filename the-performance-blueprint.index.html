const { useState, useMemo } = React;

// ---- BACKEND CONFIG -------------------------------------------------
// Fill these in after following the setup guide (SETUP-GUIDE.md).
// Until SUPABASE_URL is set, the app falls back to local-only behavior
// (nothing persists, payment prompts show a "not set up yet" note) —
// exactly like before, so it's safe to deploy before this is configured.
const SUPABASE_URL = "";        // e.g. "https://xxxxxxxx.supabase.co"
const SUPABASE_ANON_KEY = "";   // Project Settings → API → anon public key

const EDGE_FUNCTIONS_URL = SUPABASE_URL ? `${SUPABASE_URL}/functions/v1` : "";
const supabaseClient = (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
const backendReady = !!supabaseClient;

async function getOrCreateAthlete(email) {
  if (!supabaseClient || !email) return null;
  try {
    let { data: athlete } = await supabaseClient.from("athletes").select("id").eq("email", email).maybeSingle();
    if (!athlete) {
      const { data: created, error } = await supabaseClient.from("athletes").insert({ email }).select("id").single();
      if (error) { console.error(error); return null; }
      athlete = created;
    }
    return athlete.id;
  } catch (err) {
    console.error("getOrCreateAthlete failed:", err);
    return null;
  }
}

async function saveIntakeResponses(athleteId, answers) {
  if (!supabaseClient || !athleteId) return;
  try { await supabaseClient.from("intake_responses").insert({ athlete_id: athleteId, answers }); }
  catch (err) { console.error("saveIntakeResponses failed:", err); }
}

async function saveTestResultsToDb(athleteId, results) {
  if (!supabaseClient || !athleteId) return;
  try { await supabaseClient.from("test_results").insert({ athlete_id: athleteId, results }); }
  catch (err) { console.error("saveTestResultsToDb failed:", err); }
}

async function uploadMovementVideo(athleteId, movementId, file) {
  if (!supabaseClient || !athleteId) return null;
  try {
    const path = `${athleteId}/${movementId}-${Date.now()}-${file.name}`;
    const { error: uploadError } = await supabaseClient.storage.from("movement-videos").upload(path, file);
    if (uploadError) { console.error(uploadError); return null; }
    await supabaseClient.from("movement_videos").insert({ athlete_id: athleteId, movement_id: movementId, storage_path: path });
    return path;
  } catch (err) {
    console.error("uploadMovementVideo failed:", err);
    return null;
  }
}

async function startCheckout(plan, email) {
  if (!EDGE_FUNCTIONS_URL) return null;
  try {
    const res = await fetch(`${EDGE_FUNCTIONS_URL}/create-checkout-session`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ plan, email }),
    });
    const data = await res.json();
    return data.url || null;
  } catch (err) {
    console.error("startCheckout failed:", err);
    return null;
  }
}

async function checkSubscriptionStatus(email) {
  if (!EDGE_FUNCTIONS_URL || !email) return null;
  try {
    const res = await fetch(`${EDGE_FUNCTIONS_URL}/check-subscription?email=${encodeURIComponent(email)}`, {
      headers: { Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    return await res.json();
  } catch (err) {
    console.error("checkSubscriptionStatus failed:", err);
    return null;
  }
}

function calcESD(sj, cmj) {
  const s = parseFloat(sj);
  const c = parseFloat(cmj);
  if (!s || !c || s <= 0) return null;
  return ((c - s) / s) * 100;
}

function interpretESD(esd) {
  if (esd === null) return null;
  if (esd < 10) return { label: "< 10% — Poor elastic utilization", detail: "May need plyometric/reactive emphasis if strength is adequate." };
  if (esd <= 20) return { label: "10–20% — Balanced profile", detail: "No strong bias toward either force production or elastic utilization." };
  return { label: "> 20% — Strong use of the stretch-shortening cycle", detail: "Compare with sprint and strength data before deciding whether more maximal strength is needed." };
}

function App() {
  const [screen, setScreen] = useState("home");

  const [subscribed, setSubscribed] = useState(false);
  const [intakePhase, setIntakePhase] = useState(1);
  const [videos, setVideos] = useState({});
  const [testResults, setTestResults] = useState({});
  const [paymentPlan, setPaymentPlan] = useState(null); // null | "monthly" | "yearly" | "programming"
  const [intakeAwaitingPayment, setIntakeAwaitingPayment] = useState(false);
  const [athleteId, setAthleteId] = useState(null);
  const [checkoutEmail, setCheckoutEmail] = useState("");
  const [checkoutStatus, setCheckoutStatus] = useState(""); // "", "checking", "error"

  // Restore a returning visitor's email (real browser storage — this file
  // is meant to be deployed as a real site, not viewed inside an in-chat
  // artifact preview) and re-check their subscription status. Also handles
  // the redirect back from Stripe Checkout (?checkout=success/canceled).
  React.useEffect(() => {
    const savedEmail = window.localStorage ? window.localStorage.getItem("pb_email") : "";
    if (savedEmail) {
      setProfile((p) => ({ ...p, email: p.email || savedEmail }));
      setCheckoutEmail(savedEmail);
      checkSubscriptionStatus(savedEmail).then((sub) => {
        if (sub && sub.status === "active" && sub.plan) setSubscribed(sub.plan);
      });
    }
    const params = new URLSearchParams(window.location.search);
    if (params.get("checkout") === "success") {
      const email = savedEmail || params.get("email");
      const plan = params.get("plan");
      if (email) {
        setCheckoutStatus("checking");
        // Stripe's webhook may take a couple seconds to land before the DB updates
        setTimeout(() => {
          checkSubscriptionStatus(email).then((sub) => {
            if (sub && sub.status === "active") { setSubscribed(sub.plan || plan); }
            setCheckoutStatus("");
          });
        }, 2000);
      }
    }
  }, []);

  React.useEffect(() => {
    if (profile.email && window.localStorage) window.localStorage.setItem("pb_email", profile.email);
  }, [profile.email]);

  const setTest = (key, value) => setTestResults({ ...testResults, [key]: value });

  const esd = calcESD(testResults.sj, testResults.cmj);
  const esdInterpretation = interpretESD(esd);
  const sprintSplit = (testResults.sprint10 && testResults.sprint20)
    ? (parseFloat(testResults.sprint20) - parseFloat(testResults.sprint10))

              <div className="card" style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 12, letterSpacing: 1, color: "#2D6FE0", textTransform: "uppercase", marginBottom: 14 }}>How this builds your profile</div>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 6, marginBottom: 16 }}>
                  {["History", "Movement Screen", "Jump Testing", "Sprint Testing", "Athlete Profile"].map((step, i, arr) => (
                    <React.Fragment key={step}>
                      <div style={{ background: "#161A1D", border: "1px solid #2C3236", padding: "8px 12px", fontSize: 12, color: "#E8ECEE", textAlign: "center" }}>{step}</div>
                      {i < arr.length - 1 && <span style={{ color: "#5C6469" }}>→</span>}
                    </React.Fragment>
                  ))}
                </div>
                <p style={{ color: "#8A9198", fontSize: 12, marginBottom: 10 }}>
                  Your coach uses this simple funnel — plus everything above — to place you into one of these categories:
                </p>
                <div style={{ display: "grid", gap: 8 }}>
                  {ATHLETE_CATEGORIES.map((c) => (
                    <div key={c.name} style={{ display: "flex", gap: 10, alignItems: "baseline" }}>
                      <div style={{ fontSize: 13, color: "#E8ECEE", minWidth: 130 }}>{c.name}</div>
                      <div style={{ fontSize: 12, color: "#8A9198" }}>{c.desc}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 26 }}>
                <button onClick={() => setIntakePhase(2)} style={{ background: "transparent", border: "1px solid #2C3236", color: "#B2B8BC", padding: "10px 18px", cursor: "pointer" }}>Back</button>
                <button
                  onClick={async () => {
                    if (athleteId) await saveTestResultsToDb(athleteId, testResults);
                    if (subscribed === "programming") {
                      setIntakePhase(4);
                    } else {
                      setIntakeAwaitingPayment(true);
                      setPaymentPlan("programming");
                    }
                  }}
                  style={{ background: "#2D6FE0", color: "#fff", border: "none", padding: "10px 20px", cursor: "pointer" }}
                >
                  {subscribed === "programming" ? "Submit intake" : "Continue to payment"}
                </button>
              </div>
              {subscribed !== "programming" && (
                <p style={{ color: "#5C6469", fontSize: 12, marginTop: 10, textAlign: "right" }}>
                  Online Programming ($29.99/mo) is required to submit your intake and receive your assessment report.
                </p>
              )}
            </div>
          )}

          {intakePhase === 4 && (
            <div className="card" style={{ textAlign: "center" }}>
              <h2 style={{ fontFamily: "Barlow Condensed, sans-serif", fontSize: 26, textTransform: "uppercase" }}>Intake complete</h2>
              <p style={{ color: "#B2B8BC", fontSize: 14 }}>
                Thanks — your coach will review your athlete information, movement videos, and performance testing to build your program and individualized assessment report. In the meantime, check out the member resources.
              </p>
              <button onClick={() => setScreen("resources")} style={{ background: "#2D6FE0", color: "#fff", border: "none", padding: "10px 20px", cursor: "pointer" }}>View resources</button>
            </div>
          )}
        </div>
      )}

      {screen === "resources" && (
        <div style={{ maxWidth: 900, margin: "0 auto", padding: "48px 24px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 8 }}>
            <div>
              <div style={{ fontSize: 12, color: "#8A9198", textTransform: "uppercase", letterSpacing: 1 }}>Member content</div>
              <h2 style={{ fontFamily: "Barlow Condensed, sans-serif", fontSize: 30, textTransform: "uppercase", margin: "2px 0" }}>Resources</h2>
            </div>
            {!subscribed ? (
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => setPaymentPlan("monthly")} style={{ background: "transparent", color: "#E8ECEE", border: "1px solid #2C3236", padding: "10px 16px", cursor: "pointer", fontSize: 13 }}>$5.99/mo</button>
                <button onClick={() => setPaymentPlan("yearly")} style={{ background: "transparent", color: "#E8ECEE", border: "1px solid #2C3236", padding: "10px 16px", cursor: "pointer", fontSize: 13 }}>$49.99/yr</button>
                <button onClick={() => setPaymentPlan("programming")} style={{ background: "#D8342A", color: "#fff", border: "none", padding: "10px 16px", cursor: "pointer", fontSize: 13 }}>Programming $29.99/mo</button>
              </div>
            ) : (
              <span style={{ fontSize: 12, color: "#6EBF7A", border: "1px solid #2A4A2E", padding: "6px 12px" }}>
                Active subscriber · {subscribed === "yearly" ? "Resources Yearly" : subscribed === "programming" ? "Online Programming" : "Resources Monthly"} plan
              </span>
            )}
          </div>
          <RULE_LINE />

          <div style={{ marginTop: 24, display: "grid", gap: 16 }}>
            {[
              {
                title: "Sample Training Plans",
                color: "#2D6FE0",
                items: [
                  { name: "12-Week Off-Season Hockey Strength Plan", desc: "Full triphasic progression from eccentric to speed blocks." },
                  { name: "In-Season Maintenance Template", desc: "2-day-a-week plan built around game schedules." },
                  { name: "Return-to-Play Lower Body Progression", desc: "Graded reintroduction after lower-body injury." },
                ],
              },
              {
                title: "Coaching Resources",
                color: "#D8342A",
                items: [
                  { name: "Triphasic Training Explained", desc: "How eccentric, isometric, and speed blocks fit together." },
                  { name: "Reading Athlete Readiness", desc: "Simple daily markers to guide load management." },
                  { name: "Warm-Up & Movement Prep Library", desc: "Plug-and-play warm-ups by session focus." },
                ],
              },
              {
                title: "Other Content",
                color: "#6EBF7A",
                items: [
                  { name: "Nutrition Basics for Young Athletes", desc: "Fueling around training and competition." },
                  { name: "Sleep & Recovery Guide", desc: "Practical habits that actually move the needle." },
                  { name: "Monthly Coach Q&A Recording", desc: "Recorded live session answering member questions." },
                ],
              },
            ].map((section) => (
              <div className="card" key={section.title}>
                <div style={{ fontSize: 12, letterSpacing: 1, color: section.color, textTransform: "uppercase", marginBottom: 12 }}>{section.title}</div>
                <div style={{ display: "grid", gap: 10 }}>
                  {section.items.map((item) => (
                    <div key={item.name} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: "1px solid #1A1E21" }}>
                      <div>
                        <div style={{ fontSize: 14, color: subscribed ? "#E8ECEE" : "#5C6469" }}>{item.name}</div>
                        <div style={{ fontSize: 12, color: "#5C6469" }}>{item.desc}</div>
                      </div>
                      {subscribed ? (
                        <button style={{ background: "transparent", border: "1px solid #2C3236", color: "#E8ECEE", padding: "6px 12px", fontSize: 12, cursor: "pointer", whiteSpace: "nowrap" }}>Open</button>
                      ) : (
                        <span style={{ fontSize: 11, color: "#5C6469", border: "1px solid #23282C", padding: "6px 12px", whiteSpace: "nowrap" }}>Members only</span>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            ))}

            <div className="card" style={{ border: subscribed === "programming" ? "1px solid #2D6FE0" : undefined }}>
              <div style={{ fontSize: 12, letterSpacing: 1, color: "#2D6FE0", textTransform: "uppercase", marginBottom: 12 }}>
                Individualized Assessment Report {subscribed === "programming" ? "" : "(Online Programming)"}
              </div>
              {subscribed === "programming" ? (
                <>
                  <p style={{ color: "#B2B8BC", fontSize: 13, margin: "0 0 12px" }}>
                    Once your coach reviews your intake and movement assessment videos, your report will appear here, including:
                  </p>
                  <ul style={{ margin: 0, paddingLeft: 18, color: "#E8ECEE", fontSize: 14, lineHeight: 1.9 }}>
                    <li>Movement quality scorecard</li>
                    <li>Mobility and stability findings</li>
                    <li>Strength–power profile</li>
                    <li>Explosive strength analysis (SJ vs. CMJ)</li>
                    <li>Sprint profile</li>
                    <li>Training priorities</li>
                    <li>Personalized program based on your identified performance gaps/deficits and performance goals</li>
                  </ul>
                </>
              ) : (
                <p style={{ color: "#5C6469", fontSize: 13, margin: 0 }}>
                  Subscribe to Online Programming ($29.99/mo) to receive your individualized assessment report — movement quality scorecard, mobility/stability findings, strength–power profile, explosive strength analysis (SJ vs. CMJ), sprint profile, training priorities, and a personalized program built from your specific gaps and goals.
                </p>
              )}
            </div>
          </div>

          {!subscribed && (
            <p style={{ color: "#5C6469", fontSize: 12, marginTop: 20, textAlign: "center" }}>
              Subscribe above to unlock every training plan, coaching resource, and extra in the library.
            </p>
          )}
        </div>
      )}

      {paymentPlan && (
        <div
          onClick={() => { setPaymentPlan(null); setIntakeAwaitingPayment(false); }}
          style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 20 }}
        >
          <div onClick={(e) => e.stopPropagation()} className="card" style={{ maxWidth: 420, width: "100%", position: "relative" }}>
            <button onClick={() => { setPaymentPlan(null); setIntakeAwaitingPayment(false); }} style={{ position: "absolute", top: 12, right: 12, background: "transparent", border: "none", color: "#8A9198", fontSize: 18, cursor: "pointer", lineHeight: 1 }}>×</button>
            <div style={{ fontSize: 12, letterSpacing: 1, color: "#2D6FE0", textTransform: "uppercase", marginBottom: 6 }}>{PLANS[paymentPlan].label}</div>
            <div style={{ fontFamily: "Barlow Condensed, sans-serif", fontSize: 30, fontWeight: 700, marginBottom: 16 }}>{PLANS[paymentPlan].price}</div>

            {backendReady ? (
              <>
                <label style={{ fontSize: 12, color: "#8A9198" }}>Email (for your receipt and account)</label>
                <input
                  type="email"
                  placeholder="you@example.com"
                  value={profile.email || checkoutEmail}
                  onChange={(e) => { setCheckoutEmail(e.target.value); setProfile({ ...profile, email: e.target.value }); }}
                  style={{ marginBottom: 14 }}
                />
                <button
                  disabled={!(profile.email || checkoutEmail) || checkoutStatus === "checking"}
                  onClick={async () => {
                    const email = profile.email || checkoutEmail;
                    setCheckoutStatus("checking");
                    const url = await startCheckout(paymentPlan, email);
                    setCheckoutStatus("");
                    if (url) { window.location.href = url; }
                    else { setCheckoutStatus("error"); }
                  }}
                  style={{
                    width: "100%", background: "#635BFF", color: "#fff", border: "none", padding: "12px",
                    fontSize: 14, fontWeight: 600, cursor: (profile.email || checkoutEmail) ? "pointer" : "default",
                    opacity: (profile.email || checkoutEmail) ? 1 : 0.5,
                  }}
                >
                  {checkoutStatus === "checking" ? "Redirecting to Stripe..." : "Pay with Stripe"}
                </button>
                {checkoutStatus === "error" && (
                  <p style={{ color: "#E4837B", fontSize: 12, marginTop: 8, marginBottom: 0, textAlign: "center" }}>
                    Something went wrong starting checkout. Check the Edge Function logs.
                  </p>
                )}
              </>
            ) : (
              <div style={{ display: "grid", gap: 10 }}>
                {PLANS[paymentPlan].stripeUrl ? (
                  <a href={PLANS[paymentPlan].stripeUrl} target="_blank" rel="noreferrer" style={{ display: "block", textAlign: "center", background: "#635BFF", color: "#fff", padding: "12px", fontSize: 14, fontWeight: 600, textDecoration: "none" }}>
                    Pay with Stripe
                  </a>
                ) : (
                  <div style={{ background: "#161A1D", border: "1px dashed #2C3236", color: "#5C6469", padding: "12px", fontSize: 12, textAlign: "center" }}>
                    Backend not configured yet — see SETUP-GUIDE.md
                  </div>
                )}
              </div>
            )}

            <div style={{ borderTop: "1px solid #23282C", marginTop: 18, paddingTop: 14 }}>
              <button
                onClick={() => {
                  setSubscribed(paymentPlan);
                  setPaymentPlan(null);
                  if (intakeAwaitingPayment && paymentPlan === "programming") {
                    setIntakePhase(4);
                    setIntakeAwaitingPayment(false);
                  }
                }}
                style={{ width: "100%", background: "transparent", border: "1px solid #2C3236", color: "#8A9198", padding: "10px", fontSize: 12, cursor: "pointer" }}
              >
                Simulate successful payment (demo only)
              </button>
              <p style={{ color: "#5C6469", fontSize: 11, marginTop: 10, marginBottom: 0, textAlign: "center" }}>
                {backendReady ? "Simulate skips real Stripe checkout — for testing only." : "Real checkout requires the backend to be configured — see SETUP-GUIDE.md."}
              </p>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
